<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container" id="start-screen">
          <h1 id="h1">General Knowledge Quiz</h1>
          <p id="p">4 questions : test set</p>
          <button id="start-quiz">Start Quiz</button>

    </div>

    <div class="container" id="quiz-screen" style="display:none">
        <p id="progress-text">Question <span id="q-num">1</span> of <span id="q-total">4</span></p>
        <h2 id="question-text"></h2>
        <div id="options-container">

        </div>

        <button id="next-btn">Next</button>
    </div>

    <div class="container" id="result-screen" style="display:none">
        <p id="result-score"></p>
        <p>Nicely done!</p>
        <button id="retry-btn">Retry quiz</button>

    </div>

    <script src="./app.js"></script>
    
</body>
</html>
